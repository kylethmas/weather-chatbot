version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - get_weather
  - get_details

entities:
  - city
  - date
  - request

slots:
  city:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: city
        not_intent: ["deny", "goodbye"]

  date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: date
        not_intent: ["deny", "goodbye"]

  request:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: request
        not_intent: ["deny", "goodbye"]

forms:
  weather_form:
    required_slots:
      - city
      - date

responses:
  utter_greet:
    - text: "Hey! How are you?"

  utter_goodbye:
    - text: "Goodbye! Have a great day."
  
  utter_ask_city:
    - text: "Which city do you need the weather for?"

  utter_ask_date:
    - text: "For which date do you need the forecast?"

  utter_ask_more_details:
    - text: "Do you want to check the humidity, wind, or a different city?"

actions:
  - action_get_weather
  - action_reset_slots
  - utter_ask_more_details

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
